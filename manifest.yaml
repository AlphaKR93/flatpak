id: com.discord.DiscordCanary
command: discord-canary
finish-args:
  # Subsystems shared with the host
  - --share=network
  - --share=ipc

  # Socket access
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=system-bus

  # Device access
  - --device=dri
  - --device=input

  # Allowed FS subsets
  - --filesystem=xdg-download
  - --filesystem=xdg-run/speech-dispatcher

  # Environment variables
  - --env=ELECTRON_TRASH=gio
  - --env=XDG_CURRENT_SESSION=KDE
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

  # Bus
  - --own-name=org.kde.*
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.indicator.application
  - --talk-name=com.canonical.Unity
modules:
  - name: font
    buildsystem: simple
    build-commands:
      - install -Dm 644 Twemoji.ttf -t /app/share/fonts
      - install -Dm 644 font.conf /app/etc/fonts/local.conf
      - fc-cache -fv
    sources:
      - type: dir
        path: src

  - name: app
    buildsystem: simple
    build-commands:
      - install -Dm 755 -t ${FLATPAK_DEST}/bin discord-canary
      - install -Dm 755 -t ${FLATPAK_DEST}/bin disable-breaking-updates.py

      # DO NOT EDIT
      - install -Dm 755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
      - install -Dm 644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
      - install -Dm 644 -t ${FLATPAK_DEST}/share/applications ${FLATPAK_ID}.desktop
      - install -Dm 644 -t ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps ${FLATPAK_ID}.png
    sources:
      - type: file
        path: com.discord.DiscordCanary.metainfo.xml

      - commands:
          - mkdir discord/
          - tar -xzf source.tar.gz --directory=discord/ --strip-components=1
          - rm source.tar.gz

        # DO NOT EDIT
        dest-filename: apply_extra
        type: script

      - x-checker-data:
          type: rotating-url
          is-main-source: true
          url: https://discord.com/api/download/canary?platform=linux&format=tar.gz
          pattern: https://dl.discord-canary.net/apps/linux/([0-9.]+)/discord-canary-([0-9.]+).tar.gz

        url: https://canary.dl2.discordapp.net/apps/linux/1.0.1940/discord-canary-1.0.1940.tar.gz
        sha256: 23e76ef06c39a8a97014ab2cc11ebf2af585fbcb49f9f70cf0f3a8335322e34b
        size: 2223740

        # DO NOT EDIT
        type: extra-data
        filename: source.tar.gz

      # DO NOT EDIT
      - type: dir
        path: src

    modules:
      - name: pciutils
        disabled: true
        no-autogen: true
        make-args:
          - SHARED=yes
          - PREFIX=/app
        make-install-args:
          - SHARED=yes
          - PREFIX=/app
        sources:
          - type: archive
            url: https://github.com/pciutils/pciutils/archive/v3.15.0.tar.gz
            sha256: 06f467642057599acf396bc17340452fac3308f1e08be19e0c32587e42d7017b
            x-checker-data:
              type: anitya
              project-id: 2605
              url-template: https://github.com/pciutils/pciutils/archive/v$version.tar.gz

      - name: socat
        sources:
          - type: archive
            url: http://www.dest-unreach.org/socat/download/socat-1.8.1.3.tar.gz
            sha256: 06602ffd591e98c75b3dc1d66f0f19136cc666b0b2d95caad987d6ab2cb28097
            x-checker-data:
              type: anitya
              project-id: 4848
              url-template: http://www.dest-unreach.org/socat/download/socat-$version.tar.gz

  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2023.02beta.1
        commit: 64f6ccfdfd223cc2d2d68608ef42b8ff2fd6400e
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+(?:beta[\d.]+?))$

sdk: org.freedesktop.Sdk
tags: [proprietary]
runtime: org.freedesktop.Platform
runtime-version: '23.08'
separate-locales: false
